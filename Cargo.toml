[workspace]
members = [
    "crates/agentdeck-core",
    "crates/agentdeck",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/JasonBates/agentdeck-rs"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
fs2 = "=0.4.3"
humantime = "2.3"
interprocess = { version = "2.4", features = ["tokio"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
subtle = "2.6"
sysinfo = "0.33"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
http-body-util = "0.1"
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
tower = { version = "0.5", features = ["util"] }
toml = "0.9"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
