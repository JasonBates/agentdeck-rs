  }

  function renderFooter(d) {
    // Capability omission is supported by the baseline payload contract: retain the
    // footer and avoid adding a setup row or hiding an existing feed.
    if (!d.capabilities || typeof d.capabilities !== 'object') {
      renderSetupHints(null);
      featureErrors.textContent = '';
      renderFooterBaseline(d);
      return;
    }
    var caps = d.capabilities;
    var capacityStatus = caps.capacity;
    var hostStatus = caps.hostTelemetry;
    var localStatus = caps.localModelTelemetry;
    var capVisible = !capacityStatus || capacityStatus.state === 'available';
    var detailedHost = !hostStatus || hostStatus.state === 'available';
    var localVisible = !localStatus || localStatus.state === 'available';
    var systemErrors = [];

    if (capVisible) {
      // Reuse the baseline renderer for the data-bearing capacity panel.
      renderFooterBaseline(d);
    } else {
      cap.hidden = true;
      cap.className = 'quota';
      cap.innerHTML = '';
      host.textContent = d.host && d.host.ok
        ? 'load ' + d.host.load1.toFixed(1) + ' / ' + d.host.cores + ' cores' : 'load —';
    }
    if (capVisible) cap.hidden = false;
    if (capacityStatus && capacityStatus.state === 'error') {
      cap.hidden = false;
      cap.className = 'quota footer-message warn';
      cap.textContent = 'capacity unavailable (' + (capacityStatus.reason || '?') + ')';
    }
    if (hostStatus && hostStatus.state === 'error') systemErrors.push(capabilityError('host telemetry', hostStatus));
    if (localStatus && localStatus.state === 'error') systemErrors.push(capabilityError('local model telemetry', localStatus));
    // Basic load is independently useful and remains in #host even where detailed
    // telemetry is unsupported or deliberately disabled.
    renderSystem(d.host && d.host.system, d.localModel, detailedHost, localVisible, systemErrors);
    renderSetupHints(caps);
    renderFeatureErrors(caps);
  }

  function tick() {
    var now = new Date();
    clock.textContent = String(now.getHours()).padStart(2, '0') + ':' +
                        String(now.getMinutes()).padStart(2, '0');
    var modelBucket = Math.floor(Date.now() / 5000);
    if (modelBucket !== tick.modelBucket) {
      tick.modelBucket = modelBucket;
      var modelSpark = document.getElementById('modelSpark');
      if (modelSpark && last && last.localModel) {
        var compact = window.matchMedia &&
          window.matchMedia('(min-width: 901px) and (max-width: 1180px)').matches;
        modelSpark.innerHTML = modelSparkHTML(last.localModel.calls || [], compact);
      }
    }
    if (!lastMsg) {
      bridgeState.classList.add('off');
      bridgeState.lastElementChild.textContent = 'bridge —';
      age.textContent = 'awaiting data';
      return;
    }
    var secs = Math.round((Date.now() - lastMsg) / 1000);
    var stale = secs > 12;   // bridge republishes every 5s, so 12s means it's gone
    bridgeState.classList.toggle('off', stale);
    bridgeState.lastElementChild.textContent = stale ? 'AgentDeck offline' : 'AgentDeck live';
    age.textContent = secs < 2 ? 'updated now' : 'updated ' + secs + 's ago';
    document.body.classList.toggle('stale', stale);
    live.classList.toggle('off', stale);
  }
  setInterval(tick, 1000);
  tick();

  function act(el, path, payload) {
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 220);
    authorizedFetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (response) {
      if (!response.ok && response.status !== 401) throw new Error('action failed');
    }).catch(function () {});
  }

  var lastNextPane = null;

  function cardForPane(paneId) {
    var cards = grid.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('data-pane') === paneId) return cards[i];
    }
    return null;
  }

  function jumpToNext() {
    if (!last) return;
    var queue = attentionQueue(placeAgents(last.agents || []));
    if (!queue.length) return;

    // Start after the last jump and skip the already-focused card when another choice
    // exists. This makes repeated presses cycle rather than sticking on one blocked pane.
    var previous = queue.findIndex(function (a) { return a.paneId === lastNextPane; });
    var target = null;
    for (var step = 1; step <= queue.length; step++) {
      var candidate = queue[(previous + step) % queue.length];
      if (queue.length === 1 || !candidate.focused) { target = candidate; break; }
    }
    target = target || queue[(previous + 1) % queue.length];
    lastNextPane = target.paneId;

    selected = 'all';
    render(last);
    requestAnimationFrame(function () {
      var card = cardForPane(target.paneId);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      act(card, 'api/focus', { paneId: target.paneId });
    });
  }

  // Tap a card → focus that agent. Herdr switches workspace on its own when the
  // target pane lives in another one, so this doubles as a cross-space jump.
  grid.addEventListener('click', function (e) {
    if (suppressClick) { suppressClick = false; return; }   // that tap was a drag
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card) act(card, 'api/focus', { paneId: card.getAttribute('data-pane') });
  });

  // ---- drag to rearrange -------------------------------------------------
  // Pointer events, not HTML5 drag-and-drop: dragstart never fires for touch on iOS.
  // Long-press to pick up, which is the platform's own reorder gesture and leaves
  // both vertical scrolling and tap-to-focus alone.
  var HOLD_MS = 300, SLOP = 10;
  var press = null, lifted = null, dropTarget = null, suppressClick = false;

  // A drop target is either another card (trade places) or an empty slot (move there).
  function cellAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var c = el && el.closest ? el.closest('.card, .hole') : null;
    return c && c !== lifted ? c : null;
  }

  function endPress() {
    if (press && press.timer) clearTimeout(press.timer);
    press = null;
  }

  // Spare slots below the deck, present only for the length of a drag, so a card can be
  // moved past the last one. Live repaints are suspended while a card is lifted, so
  // appending to the grid here can't collide with a render. Only the whole board is a
  // canvas of slots — in a filtered view the cards are packed and a cell below them
  // wouldn't stand for any particular slot.
  var dragRow = [];

  // The empty part of the panel is board you can see, so a drag reaches all of it: on a
  // panel four rows deep every drag offers rows one to four, whether the cards fill one
  // row or three. How many rows the panel holds is counted at the deck's own row height
  // rather than measured off the cards as they happen to be laid out — a card that has
  // grown past that height would otherwise eat a row off the end, and the board you can
  // drop onto would change size with the contents of the deck instead of standing still.
  // Always at least one row past the last card: that is what a deck already filling the
  // panel gets, and the only way the board can grow downwards at all.
  function spareRowCount(cols) {
    var cs = getComputedStyle(grid);
    var gap = parseFloat(cs.rowGap) || 0;
    var rowH = parseFloat(cs.getPropertyValue('--row'));
    if (!(rowH > 0)) return 1;
    var panel = grid.clientHeight - (parseFloat(cs.paddingTop) || 0) -
                (parseFloat(cs.paddingBottom) || 0);
    var fits = Math.floor((panel + gap) / (rowH + gap));   // no trailing gap on the last
    return Math.max(1, fits - Math.ceil(grid.children.length / cols));
  }

  function openDragRow() {
    if (selected !== 'all') return;
    var slot = grid.children.length;
    var cols = columnCount(), rows = spareRowCount(cols);
    for (var r = 0; r < rows; r++) {
      for (var i = 0; i < cols; i++) {
        if (slot >= MAX_CELLS) return;   // the deck can't grow downwards for ever
        var hole = document.createElement('div');
        hole.className = 'hole';
        hole.setAttribute('data-slot', String(slot));
        grid.appendChild(hole);
        dragRow.push(hole);
        slot++;
      }
    }
  }

  function closeDragRow() {
    dragRow.forEach(function (hole) {
      if (hole.parentNode) hole.parentNode.removeChild(hole);
    });
    dragRow = [];
  }

  grid.addEventListener('pointerdown', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;
    press = {
      card: card, x: e.clientX, y: e.clientY,
      timer: setTimeout(function () {
        lifted = card;
        card.classList.add('lifted');
        document.body.classList.add('dragging');
        openDragRow();
        if (navigator.vibrate) navigator.vibrate(8);
      }, HOLD_MS)
    };
  });

  grid.addEventListener('pointermove', function (e) {
    // Movement before the hold completes is a scroll, not a drag.
    if (press && !lifted) {
      if (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP) {
        endPress();
      }
      return;
    }
    if (!lifted) return;
    e.preventDefault();
    lifted.style.transform =
      'translate(' + (e.clientX - press.x) + 'px,' + (e.clientY - press.y) + 'px) scale(1.03)';
    var over = cellAt(e.clientX, e.clientY);
    if (over !== dropTarget) {
      if (dropTarget) dropTarget.classList.remove('dropzone');
      dropTarget = over;
      if (dropTarget) dropTarget.classList.add('dropzone');
    }
  });

  function finishDrag() {
    if (lifted) {
      if (dropTarget) {
        var dragId = lifted.getAttribute('data-pane');
        if (dropTarget.classList.contains('hole')) {
          placeInSlot(dragId, Number(dropTarget.getAttribute('data-slot')));
        } else {
          swapSlots(dragId, dropTarget.getAttribute('data-pane'));
        }
      }
      lifted.classList.remove('lifted');
      lifted.style.transform = '';
      suppressClick = true;       // don't focus the agent we just dropped
    }
    if (dropTarget) dropTarget.classList.remove('dropzone');
    document.body.classList.remove('dragging');
    lifted = null; dropTarget = null;
    closeDragRow();
    endPress();
    if (last) render(last);
  }

  grid.addEventListener('pointerup', finishDrag);
  grid.addEventListener('pointercancel', finishDrag);

  // Tap a workspace pill → filter this view. It deliberately no longer switches the
  // Herdr workspace: the pills now show which space the desktop is on (the ring), and
  // a filter that also moved the Mac's focus would fight that signal.
  pills.addEventListener('click', function (e) {
    var pill = e.target.closest ? e.target.closest('.pill') : null;
    if (!pill) return;
    selected = pill.getAttribute('data-ws');
    if (last) render(last);
  });

  nextAction.addEventListener('click', jumpToNext);

  setupHints.addEventListener('click', function (e) {
    var target = e.target;
    if (!target || !target.getAttribute) return;
    var dismissKey = target.getAttribute('data-dismiss-key');
    if (dismissKey) {
      try { localStorage.setItem(SETUP_DISMISS_PREFIX + dismissKey, '1'); } catch (err) {}
      if (last) render(last);
      return;
    }
    if (target.hasAttribute('data-reset-setup-hints')) {
      resetSetupHints();
      if (last) render(last);
      return;
    }
    var command = target.getAttribute('data-copy-command');
    if (command == null) return;
    var status = document.getElementById('setupCopyStatus');
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      if (status) status.textContent = 'Copy unavailable — select the command.';
      return;
    }
    navigator.clipboard.writeText(command).then(function () {
      if (status) status.textContent = 'Copied.';
    }).catch(function () {
      if (status) status.textContent = 'Could not copy — select the command.';
    });
  });

  newTabAction.addEventListener('click', function () {
    if (!newTabWorkspaceId || creatingTab) return;
    var targetWorkspaceId = newTabWorkspaceId;
    creatingTab = true;
    newTabAction.disabled = true;
    newTabAction.className = 'new-tab-action pending';
    newTabAction.textContent = '…';

    authorizedFetch('api/tab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workspaceId: targetWorkspaceId })
    }).then(function (response) {
      if (!response.ok) throw new Error('tab creation failed');
      newTabAction.className = 'new-tab-action success';
      newTabAction.textContent = '✓';
      setTimeout(resetNewTabAction, 900);
    }).catch(function () {
      newTabAction.className = 'new-tab-action error';
      newTabAction.textContent = '!';
      setTimeout(resetNewTabAction, 1400);
    });
  });

  function resetNewTabAction() {
    creatingTab = false;
    newTabAction.className = 'new-tab-action';
    newTabAction.textContent = '+';
    if (last) render(last);
  }

  // Turning the iPad changes how many cards fit across, which changes where the empty
  // slots fall. Waiting for the next payload left a rotated deck holding stale holes
  // for a few seconds, so repaint as soon as the layout settles.
  var reflow = null;
  window.addEventListener('resize', function () {
    if (reflow) clearTimeout(reflow);
    reflow = setTimeout(function () { reflow = null; if (last) render(last); }, 120);
  });

  // Local bridges keep native EventSource reconnection. Authenticated bridges
  // use fetch streaming because EventSource cannot attach a Bearer header.
  if (authToken) connectAuthenticatedStream();
  else connectLocalStream();
})();
</script>
</body>
</html>
